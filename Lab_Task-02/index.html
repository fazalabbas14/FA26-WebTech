<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 2 — Responsive Navbar and Grid Drill</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-gray-50 font-sans text-gray-900">

    <header class="site-header">

        <nav class="navbar navbar-expand-md">
            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand" href="#">
                    TechNest.
                </a>

                <!-- Navigation links -->
                <div class="collapse navbar-collapse order-3 order-md-2" id="mainNav">

                    <ul class="navbar-nav mx-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Products</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Collections</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                    </ul>
                </div>

                <!-- Cart and hamburger -->
                <div class="nav-actions order-2 order-md-3 ms-auto
                        d-flex align-items-center gap-3">

                    <a href="#" class="cart-link">
                        <i class="fa-solid fa-bag-shopping"></i>
                        Cart
                        <span class="cart-count">0</span>
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                </div>

            </div>
        </nav>

    </header>


    <main class="container product-section">

        <div class="section-heading">
            <p>OUR COLLECTION</p>
            <h1>Featured Products</h1>
        </div>

        <div class="product-grid">

            <article class="product-card">
                <div class="product-image">
                    <img src="./assets/0003_PopLight_Pine3.jpg" alt="Portable light">
                </div>

                <div class="product-info">
                    <h3>Portable Light</h3>
                    <p>Rs. 3,000</p>
                    <button class="btn btn-outline-dark">
                        View Product
                    </button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-image">
                    <img src="./assets/0002_DeskLaptopStand-2.webp" alt="Laptop stand">
                </div>

                <div class="product-info">
                    <h3>Desk Laptop Stand</h3>
                    <p>Rs. 4,000</p>
                    <button class="btn btn-outline-dark">
                        View Product
                    </button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-image">
                    <img src="./assets/PopPhone_Mirror_5.webp" alt="POP phone">
                </div>

                <div class="product-info">
                    <h3>POP Phone</h3>
                    <p>Rs. 3,500</p>
                    <button class="btn btn-outline-dark">
                        View Product
                    </button>
                </div>
            </article>

            <article class="product-card">
                <div class="product-image">
                    <img src="./assets/SlideCardWallet-Black_34_withphone_422ac799-873c-4744-98d2-31e4a9dfe703.webp" alt="Magnetic card wallet">
                </div>

                <div class="product-info">
                    <h3>Magnetic Card Wallet</h3>
                    <p>Rs. 2,400</p>
                    <button class="btn btn-outline-dark">
                        View Product
                    </button>
                </div>
            </article>

        </div>

    </main>


    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
